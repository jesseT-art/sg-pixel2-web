name: Deploy SG Pixel2 Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download static site
        run: |
          set -euo pipefail
          mkdir -p site
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "site/$(dirname "$file")"
            curl -fsSL "https://sg-pixel2-web.sg-pixel2-room.workers.dev/$file" -o "site/$file"
          done < site-files.txt
          printf 'window.__ROOM_API__ = "https://sg-pixel2.netlify.app";\n' > site/config.js
          mkdir -p site/share
          printf '%s\n' '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../"><title>SG.像素2</title></head><body><a href="../">进入 SG.像素2</a></body></html>' > site/share/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
